<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VirtusChat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-hover: #1c263d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #23314e;
      --accent: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      user-select: none;
    }

    /* Horní lišta */
    header {
      width: 100%;
      position: sticky;
      top: 0;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    /* Vlevo: Logo a Profil */
    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span.arrow {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .user-pill {
      font-size: 0.75rem;
      background: #080c14;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 12px;
      color: #93c5fd;
    }

    /* Vpravo: Kalendář */
    .header-right {
      display: flex;
      align-items: center;
    }

    .btn-cal {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.2rem;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-cal:active {
      transform: scale(0.95);
      background-color: #334155;
    }

    /* Červený notifikační pás pod hlavičkou */
    .alert-strip {
      width: 100%;
      background: linear-gradient(90deg, #b91c1c, #dc2626);
      color: #ffffff;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(220, 38, 38, 0.3);
      z-index: 25;
    }

    .alert-strip span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Společné prvky tlačítek */
    button {
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #23314e;
      color: var(--text-main);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    /* Seznam úkolů */
    .container {
      width: 100%;
      padding: 14px 12px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.15s;
    }

    .task-item.completed {
      opacity: 0.55;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .task-left input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.35;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: text;
    }

    .task-text {
      font-size: 0.95rem;
      line-height: 1.35;
      word-break: break-word;
    }

    /* Informace o datu u úkolu */
    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.72rem;
    }

    .date-badge {
      background-color: #0b1329;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .date-badge.due {
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .date-badge.due.expired {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-weight: 700;
    }

    .assignees-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .assignee-chip {
      font-size: 0.72rem;
      background-color: #090e19;
      color: #93c5fd;
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.15rem;
      padding: 6px 8px;
    }

    .btn-icon:active {
      color: var(--text-main);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 16px;
      font-size: 0.9rem;
    }

    /* Plovoucí tlačítko vlevo dole pro adminy */
    .fab-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      font-size: 2.2rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 50;
      line-height: 0;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .overlay.active {
      display: block;
      opacity: 1;
    }

    /* Modály */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: calc(100% - 36px);
      max-width: 400px;
      z-index: 101;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    .modal.active {
      display: flex;
    }

    .modal h2 {
      font-size: 1.2rem;
    }

    input[type="text"], input[type="password"], input[type="date"], input[type="datetime-local"] {
      font-size: 16px !important;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #0b1329;
      color: var(--text-main);
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    /* Uživatelské menu */
    .user-info-box {
      background-color: #0b1329;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      background: var(--primary);
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    .password-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .password-section label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Spodní vysouvací panel (Úkoly) */
    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      z-index: 101;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 44px;
      height: 5px;
      background-color: var(--border);
      border-radius: 3px;
      margin: 0 auto 16px;
    }

    .bottom-sheet h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dates-row {
      display: flex;
      gap: 10px;
    }

    .dates-row .form-group {
      flex: 1;
    }

    .people-selector {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      -webkit-overflow-scrolling: touch;
    }

    .person-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 62px;
      flex-shrink: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #23314e;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .person-chip span {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .person-chip.selected .avatar {
      background-color: var(--primary);
      border-color: #93c5fd;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }

    .person-chip.selected span {
      color: var(--text-main);
      font-weight: 600;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-actions button {
      flex: 1;
      padding: 12px;
    }

    /* Kalendář v modálu */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cal-header h3 {
      font-size: 1rem;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 0.8rem;
    }

    .cal-day-name {
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 4px;
    }

    .cal-cell {
      padding: 8px 0;
      border-radius: 8px;
      background: #0b1329;
      cursor: pointer;
      position: relative;
    }

    .cal-cell.empty {
      background: transparent;
      cursor: default;
    }

    .cal-cell.today {
      border: 1px solid var(--primary);
    }

    .cal-cell.selected {
      background-color: var(--primary) !important;
      color: white;
      font-weight: 700;
    }

    .cal-cell.has-task::after {
      content: '';
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background-color: var(--danger);
      border-radius: 50%;
    }

    .cal-task-details {
      max-height: 120px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }

    .cal-task-item {
      background: #0b1329;
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--primary);
    }
  </style>
</head>
<body>

  <!-- Horní lišta: Vlevo VirtusChat + profil, Vpravo Kalendář -->
  <header>
    <div class="brand-left" id="brand-menu-btn" title="Otevřít profil / přihlášení">
      <div class="brand-title">
        VirtusChat <span class="arrow">▼</span>
      </div>
      <div id="header-user-badge"></div>
    </div>
    <div class="header-right">
      <button class="btn-cal" id="btn-open-calendar" title="Kalendář úkolů">📅</button>
    </div>
  </header>

  <!-- Červený notifikační pás pod hlavičkou -->
  <div class="alert-strip" id="alert-strip" style="display: none;">
    <span id="alert-strip-text">Načítám úkoly...</span>
    <span id="alert-strip-badge" style="font-size: 0.75rem; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 10px;"></span>
  </div>

  <!-- Seznam úkolů -->
  <div class="container">
    <ul class="task-list" id="task-list"></ul>
    <div class="empty-msg" id="empty-msg">Načítám úkoly...</div>
  </div>

  <!-- Plovoucí tlačítko vlevo dole (jen pro adminy) -->
  <button class="fab-btn" id="fab-add" title="Nový úkol">+</button>

  <!-- Pozadí overlay -->
  <div class="overlay" id="overlay"></div>

  <!-- Přihlašovací Modal -->
  <div class="modal" id="login-modal">
    <h2>Přihlášení</h2>
    <input type="text" id="login-username" placeholder="Uživatel (jakub, daniel, tomas, marek)" autocomplete="username" autocapitalize="none">
    <input type="password" id="login-password" placeholder="Heslo" autocomplete="current-password">
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-close-login">Zrušit</button>
      <button class="btn-primary" id="btn-submit-login">Přihlásit</button>
    </div>
  </div>

  <!-- Uživatelské Menu Modal -->
  <div class="modal" id="user-menu-modal">
    <h2>Tvůj profil</h2>
    <div class="user-info-box">
      <div>
        <strong id="menu-user-name" style="font-size: 1.05rem;">Uživatel</strong>
        <div id="menu-user-id" style="font-size: 0.8rem; color: var(--text-muted);">@id</div>
      </div>
      <span class="role-tag" id="menu-user-role">Role</span>
    </div>

    <div class="password-section">
      <label for="input-new-password">Změna hesla</label>
      <input type="password" id="input-new-password" placeholder="Nové heslo">
      <button class="btn-secondary" id="btn-change-password">Uložit nové heslo</button>
    </div>

    <div style="border-top: 1px solid var(--border); padding-top: 12px; display: flex; justify-content: space-between; gap: 10px;">
      <button class="btn-danger" id="btn-logout" style="flex: 1;">Odhlásit se</button>
      <button class="btn-secondary" id="btn-close-user-menu">Zavřít</button>
    </div>
  </div>

  <!-- Kalendář Modal -->
  <div class="modal" id="calendar-modal">
    <div class="cal-header">
      <button class="btn-secondary" id="cal-prev" style="padding: 4px 10px;">&lt;</button>
      <h3 id="cal-month-title">Měsíc Rok</h3>
      <button class="btn-secondary" id="cal-next" style="padding: 4px 10px;">&gt;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-task-details" id="cal-task-details">
      <div style="color: var(--text-muted);">Klikni na označený den pro zobrazení úkolů.</div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-close-cal">Zavřít</button>
    </div>
  </div>

  <!-- Vysouvací panel pro vytvoření / editaci úkolu (Admin) -->
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheet-title">Nový úkol</h2>

    <div class="form-group">
      <label>Popis úkolu</label>
      <input type="text" id="task-input" placeholder="Co je potřeba udělat?">
    </div>

    <div class="dates-row">
      <div class="form-group">
        <label>Od kdy (výchozí: Dnes)</label>
        <input type="date" id="task-start-date">
      </div>
      <div class="form-group">
        <label>Do kdy (Termín)</label>
        <input type="datetime-local" id="task-due-date">
      </div>
    </div>

    <div class="form-group">
      <label>Přiřadit lidi (klepnutím vyber):</label>
      <div class="people-selector" id="people-selector"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-secondary" id="btn-close-sheet">Zavřít</button>
      <button class="btn-primary" id="btn-confirm-task">Uložit</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-WH9nN8yipLOqsQz06184LBNHrdzX5ow",
      authDomain: "chat-82f9f.firebaseapp.com",
      databaseURL: "https://chat-82f9f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chat-82f9f",
      storageBucket: "chat-82f9f.firebasestorage.app",
      messagingSenderId: "1048160738014",
      appId: "1:1048160738014:web:ab9c03fbe8d0eedc27804f",
      measurementId: "G-R4BHQX7144"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    const todosRef = ref(db, 'todos');
    const usersRef = ref(db, 'users');

    let currentUser = JSON.parse(localStorage.getItem('pwa_logged_user')) || null;
    let allUsers = {};
    let allRawTasks = {};
    let selectedPeople = [];
    let editingTaskId = null;

    // Kalendář stav
    let calCurrentDate = new Date();

    // DOM elementy
    const brandMenuBtn = document.getElementById('brand-menu-btn');
    const headerUserBadge = document.getElementById('header-user-badge');
    const alertStrip = document.getElementById('alert-strip');
    const alertStripText = document.getElementById('alert-strip-text');
    const alertStripBadge = document.getElementById('alert-strip-badge');

    const overlay = document.getElementById('overlay');
    const loginModal = document.getElementById('login-modal');
    const loginUsername = document.getElementById('login-username');
    const loginPassword = document.getElementById('login-password');
    const btnSubmitLogin = document.getElementById('btn-submit-login');
    const btnCloseLogin = document.getElementById('btn-close-login');

    const userMenuModal = document.getElementById('user-menu-modal');
    const menuUserName = document.getElementById('menu-user-name');
    const menuUserId = document.getElementById('menu-user-id');
    const menuUserRole = document.getElementById('menu-user-role');
    const inputNewPassword = document.getElementById('input-new-password');
    const btnChangePassword = document.getElementById('btn-change-password');
    const btnLogout = document.getElementById('btn-logout');
    const btnCloseUserMenu = document.getElementById('btn-close-user-menu');

    const fabAdd = document.getElementById('fab-add');
    const bottomSheet = document.getElementById('bottom-sheet');
    const sheetTitle = document.getElementById('sheet-title');
    const taskInput = document.getElementById('task-input');
    const taskStartDate = document.getElementById('task-start-date');
    const taskDueDate = document.getElementById('task-due-date');
    const peopleSelector = document.getElementById('people-selector');
    const btnCloseSheet = document.getElementById('btn-close-sheet');
    const btnConfirmTask = document.getElementById('btn-confirm-task');

    const taskList = document.getElementById('task-list');
    const emptyMsg = document.getElementById('empty-msg');

    // Kalendář DOM
    const btnOpenCalendar = document.getElementById('btn-open-calendar');
    const calendarModal = document.getElementById('calendar-modal');
    const btnCloseCal = document.getElementById('btn-close-cal');
    const calMonthTitle = document.getElementById('cal-month-title');
    const calGrid = document.getElementById('cal-grid');
    const calTaskDetails = document.getElementById('cal-task-details');
    const calPrev = document.getElementById('cal-prev');
    const calNext = document.getElementById('cal-next');

    function isAdmin() {
      return currentUser && currentUser.role && currentUser.role.toLowerCase() === 'admin';
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function updateAuthUI() {
      if (currentUser) {
        headerUserBadge.innerHTML = `<span class="user-pill">👤 ${currentUser.name}</span>`;
        if (isAdmin()) {
          fabAdd.style.display = 'flex';
        } else {
          fabAdd.style.display = 'none';
        }
      } else {
        headerUserBadge.innerHTML = `<span class="user-pill" style="color: var(--primary);">Přihlásit</span>`;
        fabAdd.style.display = 'none';
      }
      renderFilteredTasks();
    }

    // Kliknutí vlevo na VirtusChat / Profil
    brandMenuBtn.addEventListener('click', () => {
      if (currentUser) {
        openUserMenu();
      } else {
        openLoginModal();
      }
    });

    function openLoginModal() {
      loginModal.classList.add('active');
      overlay.classList.add('active');
      loginUsername.value = '';
      loginPassword.value = '';
      loginUsername.focus();
    }

    function closeLoginModal() {
      loginModal.classList.remove('active');
      overlay.classList.remove('active');
    }

    btnCloseLogin.addEventListener('click', closeLoginModal);

    btnSubmitLogin.addEventListener('click', async () => {
      const usernameKey = loginUsername.value.trim().toLowerCase();
      const password = loginPassword.value.trim();

      if (!usernameKey || !password) {
        alert('Vyplň jméno i heslo.');
        return;
      }

      try {
        const snapshot = await get(ref(db, `users/${usernameKey}`));
        if (snapshot.exists()) {
          const userData = snapshot.val();
          const dbPassword = String(userData.password !== undefined ? userData.password : '').trim();

          if (dbPassword === password) {
            currentUser = {
              id: usernameKey,
              name: userData.name || usernameKey,
              role: userData.role || 'user'
            };
            localStorage.setItem('pwa_logged_user', JSON.stringify(currentUser));
            updateAuthUI();
            closeLoginModal();
          } else {
            alert('Nesprávné heslo.');
          }
        } else {
          alert('Uživatel s tímto jménem neexistuje.');
        }
      } catch (err) {
        alert('Chyba: ' + (err.code || err.message));
      }
    });

    function openUserMenu() {
      menuUserName.textContent = currentUser.name;
      menuUserId.textContent = `@${currentUser.id}`;
      menuUserRole.textContent = currentUser.role;
      inputNewPassword.value = '';
      userMenuModal.classList.add('active');
      overlay.classList.add('active');
    }

    function closeUserMenu() {
      userMenuModal.classList.remove('active');
      overlay.classList.remove('active');
    }

    btnCloseUserMenu.addEventListener('click', closeUserMenu);

    btnChangePassword.addEventListener('click', async () => {
      const newPass = inputNewPassword.value.trim();
      if (!newPass) {
        alert('Zadej nové heslo.');
        return;
      }

      try {
        await update(ref(db, `users/${currentUser.id}`), { password: newPass });
        alert('Heslo změněno!');
        inputNewPassword.value = '';
        closeUserMenu();
      } catch (err) {
        alert('Chyba při změně hesla: ' + err.message);
      }
    });

    btnLogout.addEventListener('click', () => {
      currentUser = null;
      localStorage.removeItem('pwa_logged_user');
      closeUserMenu();
      updateAuthUI();
    });

    // Realtime poslech seznamu lidí pro výběr
    onValue(usersRef, (snapshot) => {
      allUsers = snapshot.val() || {};
      renderPeopleSelector();
    });

    function renderPeopleSelector() {
      peopleSelector.innerHTML = '';
      Object.keys(allUsers).forEach((key) => {
        const person = allUsers[key];
        const personName = person.name || key;
        const chip = document.createElement('div');
        chip.className = `person-chip ${selectedPeople.includes(personName) ? 'selected' : ''}`;
        
        const initial = personName.charAt(0).toUpperCase();

        chip.innerHTML = `
          <div class="avatar">${initial}</div>
          <span>${personName}</span>
        `;

        chip.addEventListener('click', () => {
          if (selectedPeople.includes(personName)) {
            selectedPeople = selectedPeople.filter(item => item !== personName);
            chip.classList.remove('selected');
          } else {
            selectedPeople.push(personName);
            chip.classList.add('selected');
          }
        });

        peopleSelector.appendChild(chip);
      });
    }

    // Otevření popupu pro nový úkol
    function openCreateSheet() {
      editingTaskId = null;
      sheetTitle.textContent = 'Nový úkol';
      btnConfirmTask.textContent = 'Přidat úkol';
      selectedPeople = [];
      taskInput.value = '';
      taskStartDate.value = getTodayString();
      taskDueDate.value = '';
      renderPeopleSelector();
      bottomSheet.classList.add('active');
      overlay.classList.add('active');
      taskInput.focus();
    }

    // Editace úkolu pro Adminy
    function openEditSheet(task) {
      editingTaskId = task.id;
      sheetTitle.textContent = 'Upravit úkol';
      btnConfirmTask.textContent = 'Uložit změny';
      taskInput.value = task.text || '';
      taskStartDate.value = task.startDate || getTodayString();
      taskDueDate.value = task.dueDate || '';
      selectedPeople = Array.isArray(task.assignees) ? [...task.assignees] : [];
      renderPeopleSelector();
      bottomSheet.classList.add('active');
      overlay.classList.add('active');
      taskInput.focus();
    }

    function closeBottomSheet() {
      bottomSheet.classList.remove('active');
      overlay.classList.remove('active');
      editingTaskId = null;
    }

    fabAdd.addEventListener('click', openCreateSheet);
    btnCloseSheet.addEventListener('click', closeBottomSheet);

    overlay.addEventListener('click', () => {
      closeLoginModal();
      closeUserMenu();
      closeBottomSheet();
      closeCalendarModal();
    });

    // Uložení úkolu
    btnConfirmTask.addEventListener('click', () => {
      const text = taskInput.value.trim();
      if (!text) {
        alert('Zadej text úkolu.');
        return;
      }

      const sDate = taskStartDate.value || getTodayString();
      const dDate = taskDueDate.value || null;

      if (editingTaskId) {
        update(ref(db, `todos/${editingTaskId}`), {
          text: text,
          startDate: sDate,
          dueDate: dDate,
          assignees: selectedPeople
        }).then(() => {
          closeBottomSheet();
        }).catch(err => alert('Chyba: ' + err.message));
      } else {
        push(todosRef, {
          text: text,
          completed: false,
          startDate: sDate,
          dueDate: dDate,
          assignees: selectedPeople,
          createdAt: Date.now(),
          createdBy: currentUser ? currentUser.name : 'Neznámý'
        }).then(() => {
          closeBottomSheet();
        }).catch(err => alert('Chyba: ' + err.message));
      }
    });

    // Poslech úkolů z RTDB
    onValue(todosRef, (snapshot) => {
      allRawTasks = snapshot.val() || {};
      renderFilteredTasks();
    }, (error) => {
      emptyMsg.textContent = 'Chyba načítání: ' + error.message;
    });

    // Vykreslení úkolů podle role (Admin vs User) + Červený notifikační pás
    function renderFilteredTasks() {
      taskList.innerHTML = '';
      
      const tasks = Object.entries(allRawTasks).map(([id, task]) => ({ id, ...task }));
      tasks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      // Filtrování: Admin vidí vše, User vidí jen své úkoly
      const visibleTasks = tasks.filter(task => {
        if (!currentUser) return false;
        if (isAdmin()) return true;
        const taskAssignees = Array.isArray(task.assignees) ? task.assignees : [];
        return taskAssignees.includes(currentUser.name) || taskAssignees.includes(currentUser.id);
      });

      // Výpočet pro ČERVENÝ NOTIFIKAČNÍ PÁS
      if (currentUser) {
        alertStrip.style.display = 'flex';
        const uncompleted = visibleTasks.filter(t => !t.completed);
        const withDueDate = uncompleted.filter(t => t.dueDate);
        
        // Zkontrolujeme zpožděné úkoly
        const now = new Date();
        const overdue = withDueDate.filter(t => new Date(t.dueDate) < now);

        if (uncompleted.length === 0) {
          alertStripText.textContent = `Vše hotovo! Nemáš žádné otevřené úkoly.`;
          alertStripBadge.textContent = '0 úkolů';
        } else {
          let msg = `Máš ${uncompleted.length} ${uncompleted.length === 1 ? 'úkol' : (uncompleted.length < 5 ? 'úkoly' : 'úkolů')}, z toho ${withDueDate.length} s termínem.`;
          if (overdue.length > 0) {
            msg += ` ⚠️ ${overdue.length} po termínu!`;
          }
          alertStripText.textContent = msg;
          alertStripBadge.textContent = `${uncompleted.length} aktivní`;
        }
      } else {
        alertStrip.style.display = 'none';
      }

      if (!currentUser) {
        emptyMsg.textContent = 'Pro zobrazení úkolů se přihlas vlevo nahoře.';
        emptyMsg.style.display = 'block';
        return;
      }

      if (visibleTasks.length === 0) {
        emptyMsg.textContent = 'Žádné úkoly k zobrazení.';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      visibleTasks.forEach((task) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;

        // Lidé
        let assigneesHtml = '';
        const taskAssignees = Array.isArray(task.assignees) ? task.assignees : [];
        if (taskAssignees.length > 0) {
          assigneesHtml = taskAssignees.map(name => `
            <span class="assignee-chip">👤 ${name}</span>
          `).join('');
        }

        // Datum Od - Do
        let dateHtml = '';
        if (task.startDate) {
          const sD = new Date(task.startDate);
          dateHtml += `<span class="date-badge">Od: ${sD.toLocaleDateString('cs-CZ')}</span>`;
        }
        if (task.dueDate) {
          const dD = new Date(task.dueDate);
          const isExpired = !task.completed && dD < new Date();
          const dueFormat = `${dD.toLocaleDateString('cs-CZ')} ${dD.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' })}`;
          dateHtml += `<span class="date-badge due ${isExpired ? 'expired' : ''}">Do: ${dueFormat}${isExpired ? ' (Po termínu!)' : ''}</span>`;
        }

        // Kdo může odškrtnout: přiřazený člověk nebo admin
        let canToggle = false;
        if (isAdmin() || taskAssignees.includes(currentUser.name) || taskAssignees.includes(currentUser.id)) {
          canToggle = true;
        }

        // Akce pro admina
        let adminButtonsHtml = '';
        if (isAdmin()) {
          adminButtonsHtml = `
            <div class="task-actions">
              <button class="btn-icon btn-edit" title="Upravit úkol">✏️</button>
              <button class="btn-icon btn-delete" title="Smazat úkol">✕</button>
            </div>
          `;
        }

        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} ${canToggle ? '' : 'disabled'} title="${canToggle ? 'Označit hotovo' : 'Nemáš oprávnění k tomuto úkolu'}">
            <div class="task-details">
              <span class="task-text">${task.text}</span>
              ${dateHtml ? `<div class="task-meta">${dateHtml}</div>` : ''}
              ${assigneesHtml ? `<div class="assignees-container">${assigneesHtml}</div>` : ''}
            </div>
          </div>
          ${adminButtonsHtml}
        `;

        if (canToggle) {
          li.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
            update(ref(db, `todos/${task.id}`), { completed: e.target.checked });
          });
        }

        if (isAdmin()) {
          li.querySelector('.btn-edit').addEventListener('click', () => openEditSheet(task));
          li.querySelector('.btn-delete').addEventListener('click', () => {
            if (confirm(`Opravdu smazat úkol: "${task.text}"?`)) {
              remove(ref(db, `todos/${task.id}`));
            }
          });
        }

        taskList.appendChild(li);
      });
    }

    // ================= KALENDÁŘ LOGIKA =================
    btnOpenCalendar.addEventListener('click', () => {
      calCurrentDate = new Date();
      renderCalendar();
      calendarModal.classList.add('active');
      overlay.classList.add('active');
    });

    function closeCalendarModal() {
      calendarModal.classList.remove('active');
      overlay.classList.remove('active');
    }

    btnCloseCal.addEventListener('click', closeCalendarModal);

    calPrev.addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      renderCalendar();
    });

    calNext.addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      renderCalendar();
    });

    function renderCalendar() {
      calGrid.innerHTML = '';
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();

      const monthNames = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];
      calMonthTitle.textContent = `${monthNames[month]} ${year}`;

      // Dny v týdnu
      const dayNames = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
      dayNames.forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-day-name';
        el.textContent = d;
        calGrid.appendChild(el);
      });

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Pondělí = 0
      const totalDays = new Date(year, month + 1, 0).getDate();

      // Prázdné buňky před začátkem měsíce
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'cal-cell empty';
        calGrid.appendChild(emptyCell);
      }

      // Úkoly viditelné pro daného uživatele
      const tasks = Object.values(allRawTasks).filter(task => {
        if (!currentUser) return false;
        if (isAdmin()) return true;
        const taskAssignees = Array.isArray(task.assignees) ? task.assignees : [];
        return taskAssignees.includes(currentUser.name) || taskAssignees.includes(currentUser.id);
      });

      const todayStr = getTodayString();

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.textContent = day;

        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        if (dateStr === todayStr) {
          cell.classList.add('today');
        }

        // Najít úkoly pro tento den (podle startDate nebo dueDate)
        const dayTasks = tasks.filter(t => {
          const s = t.startDate ? t.startDate.slice(0, 10) : null;
          const d = t.dueDate ? t.dueDate.slice(0, 10) : null;
          return s === dateStr || d === dateStr;
        });

        if (dayTasks.length > 0) {
          cell.classList.add('has-task');
        }

        cell.addEventListener('click', () => {
          document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
          cell.classList.add('selected');

          // Vypsat úkoly
          calTaskDetails.innerHTML = '';
          if (dayTasks.length === 0) {
            calTaskDetails.innerHTML = `<div style="color: var(--text-muted);">Žádné úkoly pro ${day}. ${month + 1}. ${year}</div>`;
          } else {
            dayTasks.forEach(t => {
              const item = document.createElement('div');
              item.className = 'cal-task-item';
              item.innerHTML = `<strong>${t.completed ? '✓ ' : ''}${t.text}</strong><br><small style="color: var(--text-muted);">${t.dueDate ? 'Termín: ' + t.dueDate.replace('T', ' ') : 'Bez termínu'}</small>`;
              calTaskDetails.appendChild(item);
            });
          }
        });

        calGrid.appendChild(cell);
      }
    }

    // Service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
          reg.addEventListener('updatefound', () => {
            const w = reg.installing;
            if (w) {
              w.addEventListener('statechange', () => {
                if (w.state === 'installed' && navigator.serviceWorker.controller) window.location.reload();
              });
            }
          });
        }).catch(err => console.log('SW chyba:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

    updateAuthUI();
  </script>
</body>
</html>
