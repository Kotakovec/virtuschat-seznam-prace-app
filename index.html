<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VirtusChat To-Do</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --card-hover: #1c263d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --border: #23314e;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
      user-select: none;
    }

    /* Horní lišta */
    header {
      width: 100%;
      position: sticky;
      top: 0;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .auth-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: #080c14;
      padding: 5px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .role-tag {
      font-size: 0.65rem;
      text-transform: uppercase;
      background: var(--primary);
      color: white;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 700;
    }

    button {
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #23314e;
      color: var(--text-main);
    }

    /* Seznam úkolů */
    .container {
      width: 100%;
      padding: 14px 12px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.15s;
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: text;
    }

    .task-text {
      font-size: 0.95rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .assignees-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .assignee-chip {
      font-size: 0.72rem;
      background-color: #090e19;
      color: #93c5fd;
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.3rem;
      padding: 6px 10px;
      flex-shrink: 0;
    }

    .btn-delete:active {
      color: var(--danger);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 16px;
      font-size: 0.9rem;
    }

    /* Plovoucí tlačítko vlevo dole pro mobily */
    .fab-btn {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      font-size: 2.2rem;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 50;
      line-height: 0;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .overlay.active {
      display: block;
      opacity: 1;
    }

    /* Přihlašovací Modal */
    .login-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      width: calc(100% - 40px);
      max-width: 360px;
      z-index: 101;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    .login-modal.active {
      display: flex;
    }

    .login-modal h2 {
      font-size: 1.15rem;
    }

    /* Prevence iOS auto-zoomu (min 16px) */
    input[type="text"], input[type="password"] {
      font-size: 16px !important;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #0b1329;
      color: var(--text-main);
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--primary);
    }

    .login-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    /* Mobilní Bottom Sheet */
    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      z-index: 101;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.6);
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 44px;
      height: 5px;
      background-color: var(--border);
      border-radius: 3px;
      margin: 0 auto 16px;
    }

    .bottom-sheet h2 {
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .sheet-section-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 10px;
    }

    /* Horizontální výběr lidí pro prsty */
    .people-selector {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      -webkit-overflow-scrolling: touch;
    }

    .person-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 62px;
      flex-shrink: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: #23314e;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .person-chip span {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    .person-chip.selected .avatar {
      background-color: var(--primary);
      border-color: #93c5fd;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.5);
    }

    .person-chip.selected span {
      color: var(--text-main);
      font-weight: 600;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-actions button {
      flex: 1;
      padding: 12px;
    }
  </style>
</head>
<body>

  <!-- Mobilní horní lišta -->
  <header>
    <h1>VirtusChat To-Do</h1>
    <div class="auth-section" id="auth-section">
      <button class="btn-primary" id="btn-open-login">Přihlásit</button>
    </div>
  </header>

  <!-- Seznam úkolů -->
  <div class="container">
    <ul class="task-list" id="task-list"></ul>
    <div class="empty-msg" id="empty-msg">Načítám úkoly...</div>
  </div>

  <!-- Tlačítko + vlevo dole (jen pro Jakuba a Daniela) -->
  <button class="fab-btn" id="fab-add" title="Nový úkol">+</button>

  <!-- Pozadí modálů -->
  <div class="overlay" id="overlay"></div>

  <!-- Přihlašovací okno -->
  <div class="login-modal" id="login-modal">
    <h2>Přihlášení</h2>
    <input type="text" id="login-username" placeholder="Uživatel (jakub, daniel...)" autocomplete="username" autocapitalize="none">
    <input type="password" id="login-password" placeholder="Heslo" autocomplete="current-password">
    <div class="login-modal-actions">
      <button class="btn-secondary" id="btn-close-login">Zrušit</button>
      <button class="btn-primary" id="btn-submit-login">Přihlásit</button>
    </div>
  </div>

  <!-- Vysouvací spodní panel -->
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <h2>Nový úkol</h2>
    <input type="text" id="task-input" placeholder="Co je potřeba udělat?">

    <div class="sheet-section-title">Přiřadit lidi (klepnutím vyber):</div>
    <div class="people-selector" id="people-selector"></div>

    <div class="sheet-actions">
      <button class="btn-secondary" id="btn-close-sheet">Zavřít</button>
      <button class="btn-primary" id="btn-confirm-add-task">Přidat úkol</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-WH9nN8yipLOqsQz06184LBNHrdzX5ow",
      authDomain: "chat-82f9f.firebaseapp.com",
      databaseURL: "https://chat-82f9f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chat-82f9f",
      storageBucket: "chat-82f9f.firebasestorage.app",
      messagingSenderId: "1048160738014",
      appId: "1:1048160738014:web:ab9c03fbe8d0eedc27804f",
      measurementId: "G-R4BHQX7144"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const todosRef = ref(db, 'todos');
    const usersRef = ref(db, 'users');

    let currentUser = JSON.parse(localStorage.getItem('pwa_logged_user')) || null;
    let allUsers = {};
    let selectedPeople = [];

    const authSection = document.getElementById('auth-section');
    const btnOpenLogin = document.getElementById('btn-open-login');
    const btnCloseLogin = document.getElementById('btn-close-login');
    const btnSubmitLogin = document.getElementById('btn-submit-login');
    const loginModal = document.getElementById('login-modal');
    const overlay = document.getElementById('overlay');
    const loginUsername = document.getElementById('login-username');
    const loginPassword = document.getElementById('login-password');

    const fabAdd = document.getElementById('fab-add');
    const bottomSheet = document.getElementById('bottom-sheet');
    const btnCloseSheet = document.getElementById('btn-close-sheet');
    const btnConfirmAddTask = document.getElementById('btn-confirm-add-task');
    const taskInput = document.getElementById('task-input');
    const peopleSelector = document.getElementById('people-selector');
    const taskList = document.getElementById('task-list');
    const emptyMsg = document.getElementById('empty-msg');

    function updateAuthUI() {
      if (currentUser) {
        authSection.innerHTML = `
          <div class="auth-user-badge">
            <span>👤 ${currentUser.name}</span>
            <span class="role-tag">${currentUser.role}</span>
          </div>
          <button class="btn-secondary" id="btn-logout" style="padding: 5px 8px; font-size: 0.75rem;">Odhlásit</button>
        `;
        document.getElementById('btn-logout').addEventListener('click', handleLogout);

        if (currentUser.role && currentUser.role.toLowerCase() === 'admin') {
          fabAdd.style.display = 'flex';
        } else {
          fabAdd.style.display = 'none';
        }
      } else {
        authSection.innerHTML = `<button class="btn-primary" id="btn-open-login">Přihlásit</button>`;
        document.getElementById('btn-open-login').addEventListener('click', openLoginModal);
        fabAdd.style.display = 'none';
      }
    }

    function openLoginModal() {
      loginModal.classList.add('active');
      overlay.classList.add('active');
      loginUsername.value = '';
      loginPassword.value = '';
      loginUsername.focus();
    }

    function closeLoginModal() {
      loginModal.classList.remove('active');
      overlay.classList.remove('active');
    }

    btnOpenLogin.addEventListener('click', openLoginModal);
    btnCloseLogin.addEventListener('click', closeLoginModal);

    btnSubmitLogin.addEventListener('click', async () => {
      const usernameKey = loginUsername.value.trim().toLowerCase();
      const password = loginPassword.value.trim();

      if (!usernameKey || !password) {
        alert('Vyplň jméno i heslo.');
        return;
      }

      try {
        const snapshot = await get(ref(db, `users/${usernameKey}`));
        if (snapshot.exists()) {
          const userData = snapshot.val();
          if (userData.password === password) {
            currentUser = {
              id: usernameKey,
              name: userData.name || usernameKey,
              role: userData.role || 'user'
            };
            localStorage.setItem('pwa_logged_user', JSON.stringify(currentUser));
            updateAuthUI();
            closeLoginModal();
          } else {
            alert('Nesprávné heslo.');
          }
        } else {
          alert('Uživatel s tímto jménem neexistuje.');
        }
      } catch (err) {
        console.error(err);
        alert('Chyba spojení s Firebase.');
      }
    });

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('pwa_logged_user');
      updateAuthUI();
      closeBottomSheet();
    }

    onValue(usersRef, (snapshot) => {
      allUsers = snapshot.val() || {};
      renderPeopleSelector();
    });

    function renderPeopleSelector() {
      peopleSelector.innerHTML = '';
      Object.keys(allUsers).forEach((key) => {
        const person = allUsers[key];
        const personName = person.name || key;
        const chip = document.createElement('div');
        chip.className = `person-chip ${selectedPeople.includes(personName) ? 'selected' : ''}`;
        
        const initial = personName.charAt(0).toUpperCase();

        chip.innerHTML = `
          <div class="avatar">${initial}</div>
          <span>${personName}</span>
        `;

        chip.addEventListener('click', () => {
          if (selectedPeople.includes(personName)) {
            selectedPeople = selectedPeople.filter(item => item !== personName);
            chip.classList.remove('selected');
          } else {
            selectedPeople.push(personName);
            chip.classList.add('selected');
          }
        });

        peopleSelector.appendChild(chip);
      });
    }

    function openBottomSheet() {
      selectedPeople = [];
      taskInput.value = '';
      renderPeopleSelector();
      bottomSheet.classList.add('active');
      overlay.classList.add('active');
      taskInput.focus();
    }

    function closeBottomSheet() {
      bottomSheet.classList.remove('active');
      overlay.classList.remove('active');
    }

    fabAdd.addEventListener('click', openBottomSheet);
    btnCloseSheet.addEventListener('click', closeBottomSheet);
    overlay.addEventListener('click', () => {
      closeLoginModal();
      closeBottomSheet();
    });

    btnConfirmAddTask.addEventListener('click', () => {
      const text = taskInput.value.trim();
      if (!text) {
        alert('Zadej text úkolu.');
        return;
      }

      push(todosRef, {
        text: text,
        completed: false,
        assignees: selectedPeople,
        createdAt: Date.now(),
        createdBy: currentUser ? currentUser.name : 'Neznámý'
      }).then(() => {
        closeBottomSheet();
      }).catch(err => {
        console.error(err);
      });
    });

    onValue(todosRef, (snapshot) => {
      taskList.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        emptyMsg.textContent = 'Žádné úkoly k zobrazení.';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      const tasks = Object.entries(data).map(([id, task]) => ({ id, ...task }));
      tasks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;

        let assigneesHtml = '';
        if (task.assignees && Array.isArray(task.assignees) && task.assignees.length > 0) {
          assigneesHtml = task.assignees.map(name => `
            <span class="assignee-chip">👤 ${name}</span>
          `).join('');
        }

        const isAdmin = currentUser && currentUser.role && currentUser.role.toLowerCase() === 'admin';
        const deleteButtonHtml = isAdmin
          ? `<button class="btn-delete" title="Smazat úkol" data-id="${task.id}">✕</button>`
          : '';

        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} data-id="${task.id}">
            <div class="task-details">
              <span class="task-text">${task.text}</span>
              ${assigneesHtml ? `<div class="assignees-container">${assigneesHtml}</div>` : ''}
            </div>
          </div>
          ${deleteButtonHtml}
        `;

        li.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
          update(ref(db, `todos/${task.id}`), {
            completed: e.target.checked
          });
        });

        if (isAdmin) {
          li.querySelector('.btn-delete').addEventListener('click', () => {
            remove(ref(db, `todos/${task.id}`));
          });
        }

        taskList.appendChild(li);
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('SW registrován.'))
          .catch((err) => console.log('SW chyba:', err));
      });
    }

    updateAuthUI();
  </script>
</body>
</html>
