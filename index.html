<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Týmový To-Do List</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      background-color: #0b1329;
      color: var(--text-main);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: var(--danger);
    }

    .btn-danger:hover {
      background-color: var(--danger-hover);
    }

    /* Správa členů týmu */
    .people-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      background-color: #334155;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag button {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }

    .tag button:hover {
      color: var(--danger);
    }

    /* Seznam úkolů */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background-color: #0b1329;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-text {
      font-size: 1rem;
      word-break: break-word;
    }

    .task-assignee {
      font-size: 0.8rem;
      display: inline-block;
      width: fit-content;
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .task-assignee.unassigned {
      background-color: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.2);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Úkoly & Tým</h1>
    </header>

    <!-- Správa lidí -->
    <div class="card">
      <h2>Lidé v týmu</h2>
      <form id="person-form">
        <div class="input-row">
          <input type="text" id="person-input" placeholder="Jméno (např. Petr)" style="flex: 1;" required>
          <button type="submit">Přidat člověka</button>
        </div>
      </form>
      <div class="people-tags" id="people-container"></div>
    </div>

    <!-- Vytvoření úkolu -->
    <div class="card">
      <h2>Nový úkol</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Co je potřeba udělat?" required>
        <div class="input-row">
          <select id="todo-assignee" style="flex: 1;">
            <option value="">-- Bez přiřazení --</option>
          </select>
          <button type="submit">Přidat úkol</button>
        </div>
      </form>
    </div>

    <!-- Seznam úkolů -->
    <div class="card">
      <h2>Seznam úkolů</h2>
      <ul class="task-list" id="task-list"></ul>
      <div id="empty-state" class="empty-state" style="display: none;">Žádné úkoly k zobrazení.</div>
    </div>
  </div>

  <script>
    // Inicializace dat z LocalStorage
    let people = JSON.parse(localStorage.getItem('pwa_todo_people')) || ['Kuba', 'Honza', 'David'];
    let tasks = JSON.parse(localStorage.getItem('pwa_todo_tasks')) || [];

    // DOM elementy
    const personForm = document.getElementById('person-form');
    const personInput = document.getElementById('person-input');
    const peopleContainer = document.getElementById('people-container');
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoAssignee = document.getElementById('todo-assignee');
    const taskList = document.getElementById('task-list');
    const emptyState = document.getElementById('empty-state');

    function saveData() {
      localStorage.setItem('pwa_todo_people', JSON.stringify(people));
      localStorage.setItem('pwa_todo_tasks', JSON.stringify(tasks));
    }

    function renderPeople() {
      peopleContainer.innerHTML = '';
      todoAssignee.innerHTML = '<option value="">-- Bez přiřazení --</option>';

      people.forEach((person, index) => {
        // Tag v seznamu lidí
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `
          <span>${person}</span>
          <button type="button" onclick="removePerson(${index})" title="Odebrat">×</button>
        `;
        peopleContainer.appendChild(tag);

        // Volba v selectu přiřazení
        const option = document.createElement('option');
        option.value = person;
        option.textContent = person;
        todoAssignee.appendChild(option);
      });
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;

        const isAssigned = task.assignee && task.assignee.trim() !== '';
        const badgeClass = isAssigned ? 'task-assignee' : 'task-assignee unassigned';
        const badgeText = isAssigned ? `👤 ${task.assignee}` : 'Nepřiřazeno';

        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <div class="task-details">
              <span class="task-text">${task.text}</span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
          </div>
          <button class="btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="deleteTask(${index})">Smazat</button>
        `;

        taskList.appendChild(li);
      });
    }

    // Formulář pro přidání osoby
    personForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = personInput.value.trim();
      if (name && !people.includes(name)) {
        people.push(name);
        saveData();
        renderPeople();
        personInput.value = '';
      }
    });

    // Odebrání osoby
    window.removePerson = function(index) {
      people.splice(index, 1);
      saveData();
      renderPeople();
    };

    // Přidání úkolu
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      const assignee = todoAssignee.value;

      if (text) {
        tasks.push({
          text: text,
          assignee: assignee,
          completed: false,
          id: Date.now()
        });
        saveData();
        renderTasks();
        todoInput.value = '';
        todoAssignee.value = '';
      }
    });

    // Stav splnění úkolu
    window.toggleTask = function(index) {
      tasks[index].completed = !tasks[index].completed;
      saveData();
      renderTasks();
    };

    // Smazání úkolu
    window.deleteTask = function(index) {
      tasks.splice(index, 1);
      saveData();
      renderTasks();
    };

    // Registrace Service Workeru pro PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker úspěšně zaregistrován.'))
          .catch((err) => console.log('Chyba registrace SW:', err));
      });
    }

    // Prvotní vykreslení
    renderPeople();
    renderTasks();
  </script>
</body>
</html>
